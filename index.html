<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZZURadio - Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 640px;
      padding: 2.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #38bdf8;
    }
    p {
      font-size: 1.125rem;
      color: #94a3b8;
      line-height: 1.75;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">ZZURadio GitHub Pages</div>
    <h1 style="margin-top: 1rem;">Hello World</h1>
    <p>Welcome to ZZURadio. The official static site is currently active and served via Cloudflare CDN and GitHub Pages.</p>
  </div>
</body>
</html>
